name: Migrate Production Database

on:
  push:
    branches:
      - main
    paths:
      - "packages/data/migrations/**"
      - "packages/data/schema.prisma"
      - "packages/data/bootstrap.ts"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    env:
      # Dummy values for env validation during install/generate (DATABASE_URL overridden for actual migration)
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      EMAIL_FROM: "ci@example.com"
      AUTH_SECRET: "ci-dummy-secret-not-used"
      PROPSTO_ENV: "production"
      PROPSTO_APP_URL: "https://app.example.com"
      AUTH_URL: "https://auth.example.com"
      PROPSTO_HOST: "example.com"
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_MAIN_BRANCH_ID: ${{ vars.NEON_MAIN_BRANCH_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Resolve the production connection string from the Neon API, the same way the
      # PR dry-run does for its branch copy. This is always a direct (unpooled) URI,
      # which prisma migrate requires, and it cannot go stale like a pasted secret.
      - name: Resolve production connection string
        id: neon
        run: |
          ENDPOINT_ID=$(curl -sf \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_MAIN_BRANCH_ID/endpoints" \
            -H "Authorization: Bearer $NEON_API_KEY" | jq -r '.endpoints[0].id')
          if [ -z "$ENDPOINT_ID" ] || [ "$ENDPOINT_ID" == "null" ]; then
            echo "::error::No endpoint found on Neon branch $NEON_MAIN_BRANCH_ID"
            exit 1
          fi
          CONNECTION_URI=$(curl -sf \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$NEON_MAIN_BRANCH_ID&endpoint_id=$ENDPOINT_ID&database_name=${{ vars.NEON_DATABASE_NAME }}&role_name=${{ vars.NEON_ROLE_NAME }}" \
            -H "Authorization: Bearer $NEON_API_KEY" | jq -r '.uri')
          if [ -z "$CONNECTION_URI" ] || [ "$CONNECTION_URI" == "null" ]; then
            echo "::error::Could not resolve a connection URI for the production branch"
            exit 1
          fi
          echo "::add-mask::$CONNECTION_URI"
          echo "connection_uri=$CONNECTION_URI" >> $GITHUB_OUTPUT

      - name: Run migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.connection_uri }}
        run: pnpm --filter @propsto/data db-deploy

      - name: Bootstrap global templates
        env:
          DATABASE_URL: ${{ steps.neon.outputs.connection_uri }}
        run: pnpm --filter @propsto/data db-bootstrap

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            // Find the PR that was merged
            const commits = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha
            });

            if (commits.data.length > 0) {
              const pr = commits.data[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `⚠️ **Production database migration failed!**\n\nThe migration that was part of this PR failed to apply to production.\n\n[View workflow run](${run_url})`
              });
            }
