name: Preview label

# Previews build only for PRs labelled "preview". apps/*/vercel.json turns off Vercel's
# own Git deploys for every branch but main (a skipped build still counts toward the daily
# deployment limit), so this workflow creates the preview deployments itself.
# scripts/vercel-ignore-build.sh still skips unlabelled builds of branches made before that.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  statuses: write

jobs:
  # Deploy the PR head when the label is added and on every push while it is there.
  # No commit is pushed: a GITHUB_TOKEN push would not trigger the PR's other workflows.
  kick:
    name: Build previews for the labelled PR
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
          contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      TEAM: ${{ vars.VERCEL_TEAM_ID }}
      REPO_ID: ${{ github.event.repository.id }}
      REF: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          # A refused deployment (e.g. the daily limit, HTTP 402) must fail the job
          set -o pipefail
          # The labels API lags the event by a moment; the gate script must see the label
          sleep 15
          for project in app auth web; do
            body=$(jq -n --arg p "$project" --arg ref "$REF" --arg sha "$SHA" --argjson repo "$REPO_ID" \
              '{name: $p, project: $p, gitSource: {type: "github", repoId: $repo, ref: $ref, sha: $sha}}')
            curl -fsS -X POST "https://api.vercel.com/v13/deployments?teamId=$TEAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "$body" | jq -r '"\(.name): https://\(.url) \(.readyState)"'
          done

  # "Run E2E Tests" and the three "Vercel – <app>" statuses are required, but come from
  # preview deployments. Without the label there are none, so report them here instead.
  # A later labelled deploy posts Vercel's real statuses over these.
  e2e-gated:
    name: Run E2E Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'preview') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          for project in web app auth; do
            gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
              -f state=success -f context="Vercel – $project" \
              -f description="No preview label, so no preview build" >/dev/null
          done
          echo "No preview label, so no preview and no E2E run. Add the preview label to build previews and run E2E."
