name: E2E Tests

permissions:
  contents: read
  pull-requests: write
  deployments: read
  actions: read

on:
  deployment_status:

jobs:
  e2e:
    name: Run E2E Tests
    # Always run to report a status (required check can't be skipped)
    # Playwright 1.53 cannot install chromium on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    concurrency:
      # Per environment, so skip-only events (auth/web previews) can't cancel the real app run
      group: e2e-${{ github.event.deployment.sha }}-${{ github.event.deployment.environment }}
      cancel-in-progress: true

    steps:
      - name: Check if E2E should run
        id: should-run
        run: |
          STATE="${{ github.event.deployment_status.state }}"
          ENV="${{ github.event.deployment.environment }}"
          
          echo "Deployment state: $STATE"
          echo "Environment: $ENV"
          
          # Only run on successful app deployment
          if [[ "$STATE" == "success" ]] && [[ "$ENV" == "Preview – app" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ App deployment successful - will run E2E tests"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping E2E: state=$STATE, env=$ENV"
            echo "This is expected for non-app deployments or pending states."
          fi

      - name: Get project info
        if: steps.should-run.outputs.should_run == 'true'
        id: project
        run: |
          ENV="${{ github.event.deployment.environment }}"
          PROJECT=$(echo "$ENV" | rev | cut -d' ' -f1 | rev | tr '[:upper:]' '[:lower:]')
          echo "name=$PROJECT" >> $GITHUB_OUTPUT

      - name: Get PR number
        if: steps.should-run.outputs.should_run == 'true'
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYMENT_SHA="${{ github.event.deployment.sha }}"
          # A commit can be in several PRs (stacked branches); prefer the one it heads
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/$DEPLOYMENT_SHA/pulls --jq "(map(select(.head.sha == \"$DEPLOYMENT_SHA\")) + .)[0].number // empty")
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "No PR found for this deployment"
            exit 0
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Define preview URLs
        if: steps.should-run.outputs.should_run == 'true'
        id: urls
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          HOST="${{ vars.PROPSTO_HOST }}"
          echo "app=https://app.pr-${PR_NUM}.${HOST}" >> $GITHUB_OUTPUT
          echo "auth=https://auth.pr-${PR_NUM}.${HOST}" >> $GITHUB_OUTPUT

      # The pr-N aliases are moved by process_preview_deployment, which runs alongside this job,
      # and the auth build may still be running. Without this, tests can hit the previous deploy.
      - name: Wait for previews to serve this commit
        if: steps.should-run.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          # Superseded commits never get aliased; the readiness step below skips them.
          HEAD=$(gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }} --jq .head.sha)
          [ "$HEAD" != "$SHA" ] && { echo "⏭️ $SHA is no longer the PR head, not waiting"; exit 0; }

          # True once process_preview_deployment has pointed the pr-N alias of $1 at this commit
          aliased() {
            for run in $(gh api "repos/${{ github.repository }}/actions/workflows/process_preview_deployment.yaml/runs?head_sha=$SHA&per_page=30" --jq '.workflow_runs[].id'); do
              gh api "repos/${{ github.repository }}/actions/runs/$run/jobs" \
                --jq ".jobs[]|select(.name==\"\\\"Preview – $1\\\"\")|.steps[]|select(.name==\"Get Vercel's Alias Preview URL\")|.conclusion" | grep -qx success && return 0
            done
            return 1
          }
          for project in app auth; do
            for i in $(seq 1 40); do
              aliased $project && { echo "✅ $project alias serves $SHA"; continue 2; }
              echo "Attempt $i/40: $project alias not on $SHA yet, waiting 15s..."
              sleep 15
            done
            echo "::error::$project preview never got aliased to $SHA (10 min)"
            exit 1
          done

      - name: Check if both previews are ready
        if: steps.should-run.outputs.should_run == 'true'
        id: check-previews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A newer push supersedes this commit; its run will test the shared preview DB.
          HEAD=$(gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }} --jq .head.sha)
          if [ "$HEAD" != "${{ github.event.deployment.sha }}" ]; then
            echo "⏭️ ${{ github.event.deployment.sha }} is no longer the PR head ($HEAD), skipping"
            echo "both_ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          APP_URL="${{ steps.urls.outputs.app }}"
          AUTH_URL="${{ steps.urls.outputs.auth }}"

          # Check if URLs are reachable (retry up to 12 times with 15s delay = 3 minutes max wait)
          check_url() {
            local url=$1
            local max_attempts=12
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" | grep -qE "^(200|301|302|307|308|401|403)$"; then
                return 0
              fi
              echo "Attempt $attempt/$max_attempts: $url not ready, waiting 15s..."
              sleep 15
              attempt=$((attempt + 1))
            done
            return 1
          }

          APP_READY=false
          AUTH_READY=false

          if check_url "$APP_URL"; then
            APP_READY=true
          fi

          if check_url "$AUTH_URL"; then
            AUTH_READY=true
          fi

          echo "App ready: $APP_READY ($APP_URL)"
          echo "Auth ready: $AUTH_READY ($AUTH_URL)"
          echo "app_ready=$APP_READY" >> $GITHUB_OUTPUT
          echo "auth_ready=$AUTH_READY" >> $GITHUB_OUTPUT

          if [[ "$APP_READY" == "true" ]] && [[ "$AUTH_READY" == "true" ]]; then
            echo "both_ready=true" >> $GITHUB_OUTPUT
          else
            echo "both_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if not all previews ready
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready != 'true'
        run: |
          echo "Not all previews are ready yet. Skipping E2E tests."
          echo "This workflow will run again when the other preview is deployed."

      - name: Checkout code
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Get Playwright version
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        id: playwright-version
        run: echo "version=$(cd e2e/auth && pnpm exec playwright --version | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd e2e/auth && pnpm exec playwright install --with-deps chromium
          cd ../app && pnpm exec playwright install chromium

      - name: Install Playwright dependencies
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Database seeding now happens during Vercel build via vercel-build script
      # This ensures the same DATABASE_URL is used for both seeding and runtime

      - name: Run Auth E2E tests
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        env:
          AUTH_URL: ${{ steps.urls.outputs.auth }}
          PROPSTO_APP_URL: ${{ steps.urls.outputs.app }}
        run: |
          cd e2e/auth
          pnpm exec playwright test --reporter=line

      - name: Run App E2E tests
        if: steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        env:
          PROPSTO_APP_URL: ${{ steps.urls.outputs.app }}
          AUTH_URL: ${{ steps.urls.outputs.auth }}
        run: |
          cd e2e/app
          pnpm exec playwright test --reporter=line

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure() && steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        with:
          name: e2e-results-pr-${{ steps.pr.outputs.number }}
          path: |
            e2e/*/test-results/
            /tmp/*.png
          retention-days: 7

      - name: Comment on PR with results
        if: always() && steps.should-run.outputs.should_run == 'true' && steps.check-previews.outputs.both_ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const success = '${{ job.status }}' === 'success';
            const appUrl = '${{ steps.urls.outputs.app }}';
            const authUrl = '${{ steps.urls.outputs.auth }}';

            const body = success
              ? `✅ **E2E Tests Passed**\n\nTested against:\n- App: ${appUrl}\n- Auth: ${authUrl}`
              : `❌ **E2E Tests Failed**\n\nTested against:\n- App: ${appUrl}\n- Auth: ${authUrl}\n\n[View details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
