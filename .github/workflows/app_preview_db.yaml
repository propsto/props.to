name: App preview database

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # pull_request skips PRs with merge conflicts, so a conflicting PR closed by hand never
  # cleaned up. pull_request_target runs from main and only calls APIs, never PR code.
  pull_request_target:
    types: [closed]

concurrency:
  group: app-preview-db-${{ github.head_ref }}

jobs:
  sync:
    name: Point app preview at the branch database
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # E2E runs are keyed by commit, so a run for the previous push keeps going while this
      # push's app build reseeds the shared preview DB, and its writes break the next run.
      - name: Cancel E2E runs for older commits of this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          R=${{ github.repository }}
          OLD=$(gh api "repos/$R/pulls/$PR/commits?per_page=100" --jq '.[].sha' | grep -vx "$HEAD_SHA" || true)
          for status in in_progress queued; do
            gh api "repos/$R/actions/workflows/e2e.yaml/runs?status=$status&per_page=50" --jq '.workflow_runs[]|"\(.id) \(.head_sha)"' |
              while read -r id sha; do
                if echo "$OLD" | grep -qx "$sha"; then
                  gh api -X POST "repos/$R/actions/runs/$id/cancel" >/dev/null && echo "Cancelled E2E run $id for stale ${sha:0:7}"
                fi
              done
          done
      - uses: actions/checkout@v4
      - run: bash scripts/sync-app-preview-db.sh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          BRANCH: ${{ github.head_ref }}
          REPO_ID: ${{ github.event.repository.id }}
      # A branch pushed before its PR is opened builds without VERCEL_GIT_PULL_REQUEST_ID, so
      # the previews point at the base host instead of pr-N. Rebuild auth, then app (whose
      # E2E run would otherwise test against the stale auth).
      - name: Rebuild previews built before the PR existed
        if: github.event.action == 'opened'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          BRANCH: ${{ github.head_ref }}
          REPO_ID: ${{ github.event.repository.id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
        run: |
          API="https://api.vercel.com"
          H="Authorization: Bearer $VERCEL_TOKEN"
          # Builds started up to a minute after the PR (e.g. the Neon integration's redeploy)
          # can still miss the PR id
          cutoff=$(( ($(date -d "$PR_CREATED" +%s) + 60) * 1000 ))
          # Newest preview of $SHA for project $1 started before the cutoff? (meta.githubPrId is
          # backfilled later, so only the creation time tells)
          stale() {
            created=$(curl -sf -H "$H" "$API/v6/deployments?teamId=$VERCEL_TEAM_ID&projectId=$1&target=preview&limit=20" |
              jq --arg s "$SHA" '[.deployments[]|select(.meta.githubCommitSha==$s)][0].created // empty')
            [ -n "$created" ] && [ "$created" -lt "$cutoff" ]
          }
          redeploy() {
            jq -n --arg p "$1" --arg b "$BRANCH" --arg r "$REPO_ID" \
              '{name:$p, project:$p, gitSource:{type:"github", ref:$b, repoId:$r}}' |
              curl -sf -X POST -H "$H" -H "Content-Type: application/json" -d @- \
                "$API/v13/deployments?teamId=$VERCEL_TEAM_ID" | jq -r .id
          }
          if ! stale auth && ! stale app; then echo "Previews were built with the PR id"; exit 0; fi
          id=$(redeploy auth); echo "Rebuilding auth: $id"
          for i in $(seq 1 60); do
            state=$(curl -sf -H "$H" "$API/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" | jq -r .readyState)
            [ "$state" = READY ] && break
            [ "$state" = ERROR ] || [ "$state" = CANCELED ] && { echo "::error::auth rebuild $state"; exit 1; }
            sleep 15
          done
          echo "Rebuilding app: $(redeploy app)"

  # The Neon integration never deletes preview branches, and idle ones still count against
  # the plan. Deleting the branch also makes the integration drop auth's vars; app's are ours.
  cleanup:
    name: Delete the branch database
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - name: Delete Neon branch
        run: |
          NEON="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          ID=$(curl -sf -H "Authorization: Bearer $NEON_API_KEY" "$NEON" |
            jq -r --arg n "preview/$BRANCH" '.branches[]|select(.name==$n)|.id')
          [ -z "$ID" ] && { echo "No Neon branch preview/$BRANCH"; exit 0; }
          curl -sf -X DELETE -H "Authorization: Bearer $NEON_API_KEY" "$NEON/$ID" >/dev/null
          echo "Deleted Neon branch preview/$BRANCH ($ID)"
      - name: Delete app preview env vars
        run: |
          API="https://api.vercel.com"
          curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" "$API/v10/projects/app/env?teamId=$VERCEL_TEAM_ID" |
            jq -r --arg b "$BRANCH" '.envs[]|select(.gitBranch==$b)|.id' |
            while read -r id; do
              curl -sf -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" "$API/v9/projects/app/env/$id?teamId=$VERCEL_TEAM_ID" >/dev/null
              echo "Deleted app env $id"
            done
